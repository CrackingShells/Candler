# The real-Docker guards share one daemon and assert on their own job label;
# they run one at a time, and only when asked with --run-ignored.
[test-groups]
container-e2e = { max-threads = 1 }

[[profile.default.overrides]]
filter = "binary(guard_container_e2e)"
test-group = "container-e2e"
slow-timeout = { period = "60s", terminate-after = 3 }
