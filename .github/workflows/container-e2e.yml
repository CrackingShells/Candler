# The real-Docker guards (the guard_container_e2e and guard_cli_e2e modules
# of the `it` test binaries; guard_cli_e2e covers `candler kill`) on a Linux
# engine: the supervision gates that need the child subreaper, /proc and a host
# uid that differs from the container's. They are ignored by default and run
# here only.
name: container-e2e

on:
  pull_request:
    paths:
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - assets/docker/**
      - .config/nextest.toml
      - .github/workflows/container-e2e.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  e2e:
    name: Container e2e (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Report the engine
        run: docker version && docker info --format '{{.Driver}} {{.DriverStatus}}'
      - name: Build the testagent image
        run: docker build --label candler.test=1 -t candler-testagent:test assets/docker/testagent
      - name: Run the container guards
        run: |
          set -o pipefail
          cargo nextest run -p candler-core -p candler \
            --test it -E 'test(/^guard_container_e2e::/) | test(/^guard_cli_e2e::/)' \
            --run-ignored only --no-tests=fail --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/e2e.log"
      # --no-tests=fail rejects only an empty selection: name every guard the Linux half decides,
      # so a guard that is renamed, cfg'd out or skipped fails the job instead of passing silently.
      - name: Check every expected guard ran and passed
        if: ${{ !cancelled() }}
        run: |
          set -eu
          sed -E 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/e2e.log" > "$RUNNER_TEMP/e2e.txt"
          missing=0
          for name in b06_kernel_facts b08_self_expiry b09_host_uid_sealable b12_sweep_scope \
            b13_client_killed_container_gone b17_canary_absent b18_internal_network_no_route \
            b36_supervisor_sigkill_nothing_left b37_untrusted_upstream_gets_no_credential \
            b40_kill_all_destroys_lost_jobs_containers \
            controls_e2e_pinned_harness_passes \
            opencode_probe_reads_each_real_base_image_version \
            x1_env_image_prunes_the_named_file_and_reads_the_pin \
            x1_env_image_without_requirements_has_only_seed_packages; do
            if ! grep -Eq "PASS \[.*\] [a-z-]+::it guard_(container|cli)_e2e::([a-z0-9_]+::)*${name}\$" "$RUNNER_TEMP/e2e.txt"; then
              echo "::error::guard ${name} did not run and pass"
              missing=1
            fi
          done
          exit "$missing"
