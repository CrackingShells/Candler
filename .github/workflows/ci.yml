# The gates of AGENTS.md and the commit check of CONTRIBUTING, on every pull
# request and push to main; on a push to main that passes both, the release.
name: ci

on:
  push:
    branches:
      - main
  pull_request:
    # edited: a new title is a new merge subject, so it is checked again.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A run on main may be releasing, so it always finishes.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    name: Gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo nextest run --workspace
      - name: Document
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  commits:
    name: Commit messages
    runs-on: ubuntu-latest
    steps:
      - name: Check out the full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install cocogitto 7.0.0
        uses: cocogitto/cocogitto-action@v4.2.0
        with:
          install-only: true
      - name: Give cog the author identity cog verify reads
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Check the pull request title as the merge subject
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -eu
          printf '%s\n' "$PR_TITLE" > "$RUNNER_TEMP/merge-subject"
          grep -Eq '^merge\([a-z0-9-]+\): ' "$RUNNER_TEMP/merge-subject" || {
            echo "::error::the title becomes the merge commit's subject: merge(<scope>): <what lands and why>"
            exit 1
          }
          cog verify --file "$RUNNER_TEMP/merge-subject"
      - name: Check the pushed range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -eu
          if [ "$EVENT" = pull_request ]; then
            cog check "$PR_BASE..$PR_HEAD"
          elif [ "$PUSH_BEFORE" = 0000000000000000000000000000000000000000 ]; then
            # A first push has no earlier tip; its head commit is the range.
            if git rev-parse --verify --quiet "$PUSH_AFTER^" >/dev/null; then
              cog check "$PUSH_AFTER^..$PUSH_AFTER"
            else
              git log -1 --format=%B "$PUSH_AFTER" > "$RUNNER_TEMP/root-message"
              cog verify --file "$RUNNER_TEMP/root-message"
            fi
          else
            cog check "$PUSH_BEFORE..$PUSH_AFTER"
          fi

  release:
    name: Release
    needs: [gates, commits]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Check out the full history and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # The version commit is pushed with the git CLI.
          persist-credentials: true
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install
      - name: Install release-plz
        uses: taiki-e/install-action@v2
        with:
          tool: release-plz@0.4.2
      - name: Commit the new versions and changelogs
        run: |
          set -eu
          release-plz update --repo-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" > "$RUNNER_TEMP/bumps"
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to release."
            exit 0
          fi
          {
            echo "chore(release): bump the versions and changelogs [skip ci]"
            echo
            grep -E '^\* ' "$RUNNER_TEMP/bumps"
          } > "$RUNNER_TEMP/message"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -F "$RUNNER_TEMP/message"
          git push origin HEAD:main
      - name: Tag each new version and create its GitHub release
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
