# The gates of AGENTS.md and the commit check of CONTRIBUTING, on every pull
# request and push to main; on a push to main that passes both, the release.
name: ci

on:
  push:
    branches:
      - main
  pull_request:
    # edited: a new title is a new merge subject, so it is checked again.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A run on main may be releasing, so it always finishes.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    name: Gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Install uv, which the evaluation guards run
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo nextest run --workspace --no-fail-fast
      - name: Document
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  helper:
    name: Python helper
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python/candler-evaluator
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: Test
        run: uv run --frozen pytest -q
      - name: Lint
        run: uv run --frozen ruff check
      - name: Format
        run: uv run --frozen ruff format --check
      - name: Regenerate the wire models
        run: |
          set -eu
          uv run --frozen python scripts/gen_models.py
          test -z "$(git status --porcelain -- src/candler_evaluator/_models)" || {
            echo "::error::the committed wire models differ from the schemas: run scripts/gen_models.py"
            git status --porcelain -- src/candler_evaluator/_models
            exit 1
          }

  commits:
    name: Commit messages
    runs-on: ubuntu-latest
    steps:
      - name: Check out the full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install cocogitto 7.0.0
        uses: cocogitto/cocogitto-action@v4.2.0
        with:
          install-only: true
      - name: Give cog the author identity cog verify reads
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Check the pull request title as the merge subject
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -eu
          printf '%s\n' "$PR_TITLE" > "$RUNNER_TEMP/merge-subject"
          grep -Eq '^merge\([a-z0-9-]+\): ' "$RUNNER_TEMP/merge-subject" || {
            echo "::error::the title becomes the merge commit's subject: merge(<scope>): <what lands and why>"
            exit 1
          }
          # GitHub appends " (#<number>)" to the title, and the result must fit in 72.
          suffix=" (#${PR_NUMBER})"
          limit=$((72 - ${#suffix}))
          length=$(printf '%s' "$PR_TITLE" | LC_ALL=C.UTF-8 wc -m | tr -d ' ')
          [ "$length" -le "$limit" ] || {
            echo "::error::the title has $length characters; with GitHub's \"$suffix\" the merge subject must fit in 72, so at most $limit"
            exit 1
          }
          cog verify --file "$RUNNER_TEMP/merge-subject"
      - name: Check the pushed range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -eu
          if [ "$EVENT" = pull_request ]; then
            cog check "$PR_BASE..$PR_HEAD"
          elif [ "$PUSH_BEFORE" = 0000000000000000000000000000000000000000 ]; then
            # A first push has no earlier tip; its head commit is the range.
            if git rev-parse --verify --quiet "$PUSH_AFTER^" >/dev/null; then
              cog check "$PUSH_AFTER^..$PUSH_AFTER"
            else
              git log -1 --format=%B "$PUSH_AFTER" > "$RUNNER_TEMP/root-message"
              cog verify --file "$RUNNER_TEMP/root-message"
            fi
          else
            cog check "$PUSH_BEFORE..$PUSH_AFTER"
          fi

  release:
    name: Release
    needs: [gates, commits]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Check out the full history and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # The version commit is pushed with the git CLI.
          persist-credentials: true
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install
      # 0.4.3 at least: the musl builds of 0.4.2 fail every changelog with
      # "stack limit reached" (release-plz#3299, fixed by pest 2.9.5).
      - name: Install release-plz
        uses: taiki-e/install-action@v2
        with:
          tool: release-plz@0.4.3
      - name: Commit the new versions and changelogs
        run: |
          set -eu
          release-plz update --repo-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" > "$RUNNER_TEMP/bumps"
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to release."
            exit 0
          fi
          {
            echo "chore(release): bump the versions and changelogs [skip ci]"
            echo
            grep -E '^\* ' "$RUNNER_TEMP/bumps"
          } > "$RUNNER_TEMP/message"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -F "$RUNNER_TEMP/message"
          git push origin HEAD:main
      - name: Tag each new version and create its GitHub release
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
