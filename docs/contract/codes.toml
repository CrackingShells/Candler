variant = "DuplicateStep"
reason = "a step registered twice is a wiring fault of the binary, not an input of the author"

[internal."candler_core::resolve::preflight::ResolveError::DerivedTwice"]
enum = "ResolveError"
variant = "DerivedTwice"
reason = "two steps deriving one path is a wiring fault of the binary, not an input of the author"

[internal."candler_core::runner::plan::PlanError::StoredCellAmbiguous"]
enum = "PlanError"
variant = "StoredCellAmbiguous"
reason = "ambiguous stored cells are a fault of the store's content, not an input of the author"

[internal."candler_core::runner::plan::PlanError::AttemptOverflow"]
enum = "PlanError"
variant = "AttemptOverflow"
reason = "an attempt counter at its limit is a fault of the store, not an input of the author"

[internal."candler_core::runner::plan::PlanError::Cell"]
enum = "PlanError"
variant = "Cell"
reason = "a cell the builder refuses is a fault of the resolver's output, not an input of the author"

[internal."candler_core::runner::plan::PlanError::Store"]
enum = "PlanError"
variant = "Store"
reason = "a store fault met while planning is reported through the store's own error"

[internal."candler_core::runner::plan::PlanError::Lock"]
enum = "PlanError"
variant = "Lock"
reason = "a lock that cannot be tried is an operating-system fault, not an input of the author"

[internal."candler_core::runner::evidence::catalog::CatalogError::Unavailable"]
