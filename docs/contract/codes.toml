variant = "AbsolutePath"
reason = "the catalog is captured by Candler's own command, so an absolute path is Candler's fault"

[internal."candler_core::runner::evidence::catalog::CatalogError::Digest"]
enum = "CatalogError"
variant = "Digest"
reason = "a catalog with no canonical form is a fault of the capture, not an input of the author"

[internal."candler_core::runner::evidence::census::CensusError::Value"]
