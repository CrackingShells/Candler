# ends_table.toml: the ends table, rows E01-E18 (B29 oracle, plan D5).
# Hand-transcribed from __reports__/m2b-execution-parity/01-test_definition_v0.md (B29 rows; the
# lead's pre-drafted rows), with `ended_by` and `retry` for invalid rows read from
# 00-architecture_v0.md section 13. Implementers may add rows, never edit.
#
# Row order is the R2 precedence order of `classify_end` (first match wins). The precedence list,
# from section 13 and R2 of m2b-arch-review-rulings.md:
#   1. Our stop with cause budget_stop or killed -> invalid with that reason (E11, E12, E14).
#   2. Daemon facts: client exit 125, container never started, or inspect missing -> infrastructure.
#      Only with no stop of ours and no deadline. With a deadline and no inspect the end is the
#      wall cap, and the missing inspect is recorded (E09, E18 variant).
#   3. OOMKilled -> infrastructure, never retried. Checked before 137 (E10).
#   4. 137 with no stop of ours and no deadline -> infrastructure. Ended::Deadline counts as ours (E17).
#   5. Gateway signals from the gateway log or the probe -> gateway, retried once (E05).
#   6. Reader: format_unknown, then reader_error (E16).
#   7. Trace-based gateway: 0 tokens, or an error result with a provider status -> gateway,
#      retried once. Checked before the wall cap (E03, E04, E06).
#   8. Collection failed -> collection_error (E15).
#   9. Input leak -> input_leak (no E row; M1's I10 guards own it).
#  10. The ended_by qualifier, for a run still valid: wall cap (Ended::Deadline or exit 124) gives
#      cap{wall} (E08, E18); then the trace's turn or cost cap (E07), agent error (E02), completed
#      (E01). A silent trace with no stop of ours and no deadline gives infrastructure.
#  E13 is not a classify_end row: seal_interrupted after `lost`, never from a live run.
#
# Fields. An input field that a row omits is not an input of that row (the leaf's harness picks
# a neutral value; the expected end must not depend on it).
#   client_exit       exit status of the docker client
#   inspect           recorded fixture in tests/fixtures/docker/inspect: clean | exit124 | oom,
#                     "missing" (no inspect), or "unrecorded" (no recorded vector; see the row)
#   inspect_exit      State.ExitCode of the inspect
#   oom_killed        State.OOMKilled of the inspect
#   container_started false when the container never started
#   our_stop          the supervisor's own act: none | budget_stop | killed
#   deadline          true when the supervisor's per-run wall deadline fired (Ended::Deadline)
#   stream            a short tag: result_ok | result_error_no_status | result_error_provider_status
#                     | result_max_turns | zero_tokens | none | unparsable | unknown_format_version
#                     | provider_error_during_teardown
#   tokens            positive | zero
#   gateway_signal    none | connection_refused (gateway log or probe)
#   collect_ok        false when collection failed
#   attempt           1 or 2 (the retry attempt)
#   supervisor_lost, run_done   for E13
# Expected. status = valid | invalid; reason = the invalid reason (empty when valid);
#   ended_by is the measured end: completed, agent_error, cap:turns, cap:wall, gateway_error,
#   budget_stop, killed, interrupted, unknown, or (E15 alone) the literal end of the intact run, completed;
#   retry = once | never | none (none: the source states no retry).

