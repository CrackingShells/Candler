# field_paths.toml: the configuration-surface field paths and their class (B19 oracle, plan D5).
# Hand-transcribed, never generated and never imported from `experiment::paths`:
#   __reports__/m2b-execution-parity/00-architecture_v0.md section 11 (normative), with the
#   rulings R21 (request.harness, request.treatment),
#   D9 (model.token_secret) and D17 (model.effort) from m2b-arch-review-rulings.md.
# Classes (section 11): cell_value (hashed and compared), setting (dropped from `Comparable`),
# typed_root (reserved, filled by derived steps, never by the file).
# Brace rows are expanded to one path each. A row whose report text names no members stays a
# wildcard (`wildcard = true`): `mcp.*` and `isolation.limits.*` (the report names the flags
# --pids-limit, --memory, --cpus, and one path, `isolation.limits.memory`, which has its own row).
# `budget.*` except `budget.per_run.*` is expanded with the keys R01 section "Experiment file"
# lists: max_runs, max_tokens, max_cost_usd, wall_s, max_parallel.
# Rules to test (section 11): no value sits below a typed root; no value is an absolute path.

[[path]]
path = "model.id"
class = "cell_value"
source = "experiment file (fixed, factors)"

[[path]]
path = "model.endpoint"
class = "cell_value"
source = "experiment file (fixed, factors)"

[[path]]
path = "model.effort"
class = "cell_value"
source = "experiment file; the driver emits --effort only when set (D17)"

[[path]]
path = "model.token_secret"
class = "setting"
source = "experiment file: names one secrets[] entry, refused if absent (D9)"

[[path]]
