# The source files of the workspace that call unix-only APIs (`std::os::unix`, `rustix::`,
# `libc::`). It is the checklist of a native Windows port: each entry says what the file calls
# and what replaces it on Windows. `guard_platform_seam` keeps it equal to the code.

[[file]]
path = "crates/candler-core/src/supervise/signal.rs"
uses = ["kill and process-group signals (`kill_process`, `kill_process_group`, `getpgrp`)", "`/proc/<pid>/stat` reads for the start time", "`MetadataExt` on a file"]
windows = "Job Objects: `TerminateJobObject` stops the tree, and a gentle stop is `CTRL_BREAK` to a `CREATE_NEW_PROCESS_GROUP` console; a held process handle pins the process, so its id cannot be reused while the handle is open (the pid-reuse rule)"

[[file]]
path = "crates/candler-core/src/supervise/platform.rs"
uses = ["`rustix::process::Pid` as the process id type", "start time from `/proc` (Linux) or `libproc` (macOS)"]
windows = "a held process handle pins the process, so its id cannot be reused while the handle is open (the pid-reuse rule); the start time is `GetProcessTimes` on that handle"

[[file]]
path = "crates/candler-core/src/supervise/reap.rs"
uses = ["`getpgid` to check that the record's process leads its group"]
windows = "no group id to check: a Job Object holds the group, so the record names the job and the held handle replaces the leader check"

[[file]]
path = "crates/candler-core/src/supervise/spawn.rs"
uses = ["`Signal` for the stop signal of a spawned process"]
windows = "Job Objects: `TerminateJobObject` stops the tree, and a gentle stop is `CTRL_BREAK` to a `CREATE_NEW_PROCESS_GROUP` console"

[[file]]
path = "crates/candler-core/src/supervise/stop.rs"
uses = ["`Signal` and the TERM then KILL ladder", "`ExitStatusExt::signal` to read how a child died"]
windows = "Job Objects: `TerminateJobObject` stops the tree, and a gentle stop is `CTRL_BREAK` to a `CREATE_NEW_PROCESS_GROUP` console; an exit code is all a Windows child reports, so `ExitStatus::Signal` has no source"

[[file]]
path = "crates/candler-core/src/supervise/mod.rs"
uses = ["`Signal::KILL` in `kill_all`, the test-support cleanup"]
windows = "`TerminateJobObject` in `kill_all`"

