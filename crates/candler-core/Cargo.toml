[package]
name = "candler-core"
description = "Candler core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# Seams for tests: the signal guard and its signaller, `Supervisor::with_signaller`,
# `Supervisor::kill_all` and `Supervisor::holds_group`. Off by default; the crate's own tests turn
# it on through the dev-dependency on itself. It is for the crate's own tests; never enable it on
# a production dependency edge.
test-support = []

[dependencies]
candler-harness.workspace = true
candler-schemas.workspace = true
flate2.workspace = true
futures.workspace = true
globset.workspace = true
jiff.workspace = true
regex.workspace = true
rustix.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
sha2.workspace = true
shell-words.workspace = true
statrs.workspace = true
jsonschema.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
url.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libproc.workspace = true

[dev-dependencies]
candler-core = { path = ".", features = ["test-support"] }
candler-harness-claude-code.workspace = true
candler-harness-opencode = { path = "../candler-harness-opencode" }
proptest.workspace = true
rand_chacha.workspace = true
tempfile.workspace = true

[lints]
workspace = true
