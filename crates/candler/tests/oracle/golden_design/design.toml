# The golden design's store: 3 models x 4 htn-creator versions x 20 runs. Both the Rust test and
# second_engine.py read this file. In every cell the first `k` replicates pass the expectation, and
# the first `w` replicates of the weighted expectation weigh 5/5 where the others weigh 2/5.
#
# Planted: version 1 -> version 2 raises gate g1 from 5/20 to 17/20 in model 1 and from 6/20 to
# 16/20 in model 2 and leaves model 3 at 10/20 (a real effect in 2 of 3 models); versions 3 and 4
# hold identical counts in every model and expectation (the null pair).

