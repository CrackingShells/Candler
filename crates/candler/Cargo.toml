[package]
name = "candler"
description = "The candler binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
candler-core.workspace = true
candler-harness.workspace = true
candler-harness-claude-code.workspace = true
candler-harness-opencode.workspace = true
semver.workspace = true
candler-schemas.workspace = true
clap.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true

[dev-dependencies]
candler-core = { workspace = true, features = ["test-support"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "2", features = ["full"] }
tempfile.workspace = true

[lints]
workspace = true
