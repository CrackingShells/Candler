# config/opencode.json is a file the driver renders for a cell with the model `claude-x` and two MCP
# servers; it was run through `opencode debug config` in the base image (assets/docker/base-opencode,
# --network none, hardened as above, CANDLER_GATEWAY_URL=http://gateway:8080/r/tag/run/key,
# CANDLER_GATEWAY_TOKEN set), and `opencode run -m candler/zzz` loaded it without error. The
# recorded output is config/debug_config.out: `{env:CANDLER_GATEWAY_URL}/v1` expanded inline to
# `http://gateway:8080/r/tag/run/key/v1`, secrets shown as `***`. No model was called.
[config.opencode_json]
recorded = "2026-11-12"
checked_with = "opencode debug config, opencode v2.2.7, linux/arm64"
