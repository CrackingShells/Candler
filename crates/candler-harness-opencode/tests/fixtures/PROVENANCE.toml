# The streams below (`oc_step_cap`, `oc_permission_ask`; `oc_effort_*` and the removal of
# `oc_effort_variant` and `oc_plan_mode_blocks_shell` are in fix round 1) were recorded on 2026-11-12 for the `opencode_settings` leaf, against
# the same scratch fake model (`oc-*` model ids, extended with the `shell` tool and driven by the
# request's own `tool_choice`; the committed `assets/docker/fakemodel/fakemodel.py` is untouched),
# through a real production-shaped gateway sidecar (`assets/docker/gateway`, built from the
# repository's own Dockerfile) on a user-defined Docker bridge network, rather than the earlier
# `--network none` probes. Engine: docker 29.9.2, Docker Desktop on macOS 26.6.2, same host as
# `[engine]` above. The base image is `assets/docker/base-opencode` built unmodified at v2.2.7. No
# token was spent, no real model and no RiVault host was called.

# oc_step_cap was re-recorded a second time on 2026-11-12, to commit a
# `wire.jsonl` alongside `stdout.jsonl`/`export.json`: a redacted, per-request projection of the
# fake model's own `records.jsonl` (model id, whether `tools` was offered, `tool_choice`, and for
# the effort case `thinking`/whether `effort` itself reached the wire) -- no header, no secret, no
# message body -- so the O1/wire gate (`cargo nextest run -p candler-harness-opencode --no-tests=fail
# -E 'test(/^opencode_wire_/)'`) can assert the wire facts from a committed file rather than only
# from this table's prose. Session ids changed accordingly; `oc_step_cap`'s re-recording also
# surfaced a third, tool-less prefatory HTTP request that the committed `stdout.jsonl`'s own step
# trace never counts (see its `exit.toml`/`expected.toml`).
# Since fix round 1 `oc_step_cap` is no longer a mapping's proof but the evidence for REFUSING
# `budget.per_run.turns`: the last request is tool-less with an injected prompt and the run ends
# `succeeded`, not Claude Code's `error_max_turns`. Its extra tool-less request is the hidden
# `title` agent's. `oc_permission_ask` is the evidence that OpenCode without `--auto` rejects a
# pending ask.
[stream.oc_step_cap]
model = "fake"
stdout_sha256 = "9c909dfb9e02b2ddcf32851734911242b0eaa47d112b7448f2703a7c9cd8fa11"
export_sha256 = "7ecd73939b40a9fdcb3562a74a120805bb6597f831c373d19185897145ce755b"
wire_sha256 = "0d6a56c13197b12878ca5d9b720e39489d4a57c54f2f955fea807760a954d9e6"

