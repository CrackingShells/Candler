# The OpenCode binary every recorded run in this directory came from.

[harness]
name = "opencode"
version = "2.2.7"
source = "https://github.com/anomalyco/opencode/releases/download/v2.2.7/opencode-linux-arm64.tar.gz"
size_bytes = 120326654
sha256 = "c1682057f0815cb2abdd6e00305f1146ebaf1c167f0335cdb74ddc80008120e7"   # the release archive
binary = "opencode"                       # the only file in the archive, installed at /opt/opencode/opencode
binary_sha256 = "c577783eacf7d1e66661fc7fd904b7646761497b687ff8f8f82ebe4f2f3ea425"
architecture = "linux/arm64"

# Every stream under streams/ was recorded on 2026-11-12 against the fake model (a scratch copy of
# assets/docker/fakemodel/fakemodel.py with scripts for OpenCode's tools, kept outside the
# repository) through the production gateway sidecar. No token was spent, no real model and no
# RiVault host was called: "model" below is always the fake.

[engine]
docker = "29.9.2"
host = "Docker Desktop on macOS 26.6.2, kernel 7.0.14-linuxkit, arm64"

[invocation]
container = "--init --read-only, /tmp tmpfs noexec, --cap-drop ALL, no-new-privileges, pids 512, memory 4g, cpus 2, uid 10001, an --internal network (no route out); /home/agent (HOME, XDG_*, OPENCODE_DB) and /work bind-mounted"
base = "python:3.12-slim-bookworm@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df (the base of assets/docker/base) plus /opt/opencode/opencode"
gateway = "assets/docker/gateway, upstream fake-anthropic.test:8443, the fake's CA at /run/gw/ca.pem; the agent held only a placeholder key"
provider = "opencode.json: provider.fake, npm @ai-sdk/anthropic, options.baseURL = {env:OC_BASE_URL}, options.apiKey = {env:OC_API_KEY}"
fake_model_scripts = "o1: a prompt gets one shell call (echo to /work/o1.txt), its result gets 'done'. o2: the shell call sleeps 90 s. nomodel1: 404 not_found_error."

