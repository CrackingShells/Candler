# Hand-written from the raw lines with jq. Recorded by real Claude Code on the parity rig: one turn
# of three Bash calls (`exit 3`; `echo oops >&2; exit 2`; a Python sleep with `timeout: 1000`),
# then a second turn that starts when the backgrounded sleep ends. No denial, no subagent.
stream = "agent_stream.jsonl.gz"
frames = 18
blank_frames = []
non_json_frames = []
subagent_ids = []
denials = []
mcp_calls = []
frame_sessions = []
cost_reporting = "running"
tokens_reporting = "per_turn"

[[sessions]]
id = "d5ff5efc-d943-44df-a357-f087b8668786"
ended_by = "completed"

# Exit of each listed result, from jq over the raw lines (the rule: Bash only; "Exit code N" leads the content -> N;
# a result moved to the background or any other error text -> no code; a non-error result -> 0). `code` absent means no exit.
# Rows cover every distinct shape of a result in the stream, and every nonzero exit.
[[exits]]
tool_use_id = "toolu_fake_sh_timeout"
session = "d5ff5efc-d943-44df-a357-f087b8668786"
tool = "Bash"

[[exits]]
tool_use_id = "toolu_fake_sh_stderr"
session = "d5ff5efc-d943-44df-a357-f087b8668786"
tool = "Bash"
code = 2

[[exits]]
tool_use_id = "toolu_fake_sh_exit3"
session = "d5ff5efc-d943-44df-a357-f087b8668786"
tool = "Bash"
code = 3
