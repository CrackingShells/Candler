# (sha256:57f339fc3580d09e8f0c9284d2177449c476f31e8bcd092dcdc631c3b3ea2a48, on candler-base
# candler.cc_version=2.1.311). Docker 29.9.2, Docker Desktop on macOS. No token was spent.
# The fake model is the fakemodel.py of the repository with one extra script, model id sh1, kept
# outside the repository: the first prompt is answered with one assistant message holding three
# Bash calls, toolu_fake_sh_exit3 {command: "exit 3"}, toolu_fake_sh_stderr {command:
# "echo oops >&2; exit 2"} and toolu_fake_sh_timeout {command: "python3 -c 'import time;
# time.sleep(30)'", timeout: 1000}; any later request is answered "done". The timeout is the Bash
# tool's own input field in milliseconds, the shortest the rig's configuration gives (the rig sets
# no default). A bare "sleep 30" was refused by Claude Code itself ("Blocked: standalone sleep 30"),
# hence the Python sleep. The stream is the harness's stdout, each raw frame's text as one line.

