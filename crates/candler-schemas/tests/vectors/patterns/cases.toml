# Hand-written accept and refuse strings for the patterns of `FieldPath` and `Marker`.
#
# `tests/guard_pattern_vectors.rs` asserts them through the Rust types and through the generated
# schema fragments; `probe.py` (Python `re`) and `probe.mjs` (ECMAScript, `u` flag) replay them
# against `pattern`. The `pattern` of each table is the published one, and the Rust test refuses a
# table whose `pattern` differs from the generated schema's.

[field_path]
pattern = '^[a-z][a-z0-9_]*(?:[.][a-z][a-z0-9_]*)*(?![\s\S])'
accept = [
  "a",
  "z",
  "a0",
  "a_",
  "a_b",
  "a__b",
  "a_0",
  "name",
  "snake_case_name",
  "slots",
  "slots.count",
  "store.root",
  "plugins.dirs",
  "a.b",
  "a.b.c",
  "a0.b1.c2",
  "a_.b_",
  "a.b_c.d9",
  "x.y.z.w.v.u",
  "abcdefghijklmnopqrstuvwxyz.abcdefghijklmnopqrstuvwxyz",
  "a.b0",
  "a.z9_9",
  "run.cell.replicate",
  "m.n",
  "k.k.k",
]
refuse = [
  "",
  ".",
  "a.",
  ".a",
  "a..b",
  "a.b.",
