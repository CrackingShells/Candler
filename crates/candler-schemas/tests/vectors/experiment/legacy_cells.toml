# The experiment texts that tests of the repository build inline, with the digest of each cell they
# list: the sha256 of the RFC 8785 form of the cell's JSON, in the order `cells()` returns them.
# `cont_train.toml` sits beside this file and is entered as a file. None of the texts has a field
# added after b017d31 or a table under `prompt.values`, so their digests never move. Recorded from
# the b017d31 code before any edit of `src/`. Never edit a digest to make a test pass.

