# Hand-written pointers: malformed documents and the RFC 6901 pointer a person would give.
#
# `file` names the document kind (experiment, suite, manifest) and `format` its text form. For the
# experiment file the pointer is into the document as Candler reads it, after the TOML-to-JSON
# step: `fixed` is flat, so a key `plan.model` is `/fixed/plan.model`. `pointer` is omitted when
# the fault is at the root of the document, which has no pointer to name it; `missing` names the
# required field the message must mention, since the pointer then names its parent.
#
# `unknown = true` marks a key the type does not have: the refusal carries the code
# `<surface>.unknown_field` and the pointer names the key itself. The tables `fixed` and a factor's
# levels, and a suite entry's `params`, are open: their keys are not checked here. So is a suite's
# optional `[source]` table, which records where a translated suite came from.

[[case]]
name = "a wrong type"
file = "experiment"
format = "toml"
pointer = "/replicates"
text = '''
schema = "experiment/1"
replicates = "two"

[budget.per_run]
wall_s = 60

[harness]
name = "claude-code"

[treatment]
name = "t"
'''

