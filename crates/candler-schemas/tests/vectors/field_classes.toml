# The class of every property of the nine schema files of the six contract surfaces, by file and
# dotted path (`[]` is an array item). Classified by hand against the frame of the contract pages:
#
#   candler   what Candler writes and an author never sets;
#   free      stored and never read, so it needs no schema of its own;
#   required  an author sets it, and it is in the file's `required`;
#   optional  an author may set it, and it is not in `required`.
#
# A map-valued property (`fixed`, a suite entry's `params`, a plug-in's `params_schema`) and a
# value object are one field: the table does not descend into them. The first two classes are
# declared in the schema with `x-candler-class`; the other two are read from `required`. A
# declaration sits on a property of a type that only the nine files carry: a field of the outcome
# record would also reach `event-envelope.schema.json`, which holds no such declaration.

