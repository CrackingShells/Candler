question = "Does domain.py pass structural validation?"
tier = "structure"
scale = "binary"

[expectations.params.check]
field = "exit_code"
op = "eq"
value = 0

[[expectations.applies_to]]
path = "plan.config"
any_of = [
    "with_skill",
    "without_skill",
]

[[expectations]]
