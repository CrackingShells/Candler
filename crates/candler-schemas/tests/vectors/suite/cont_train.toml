[expectations.params]
file = "domain.py"
pattern = "Domain\\(\"{domain_name}\"\\)"
text = "domain.py contains a Domain() declaration with the name '{domain_name}'"
question = "Is the Domain(\"{domain_name}\") declaration present and named?"
tier = "structure"
scale = "binary"

[[expectations.applies_to]]
path = "plan.config"
any_of = [
    "with_skill",
    "without_skill",
]

[[expectations]]
