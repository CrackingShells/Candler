# The e2e audit experiment: OpenCode through the gateway, model x treatment (2 x 2), 2 replicates,
# one declared stdio MCP server, a task that makes the agent write a file. Every value is in the
# file; the secret is named by its variable only. The treatment repository is staged by commands.sh.
schema = "experiment/1"
replicates = 2
secrets = ["RIVAULT_LLM_INFERENCE"]

[fixed]
permission_mode = "bypassPermissions"
"model.endpoint" = "https://api.class2.llm.ai.r-ccs.riken.jp"
"model.token_secret" = "RIVAULT_LLM_INFERENCE"
"prompt.template" = "Call the MCP tool audit_stamp once. Then use the shell tool to create /work/outputs and write the text it returned, on one line and nothing else, to /work/outputs/answer.txt. Then reply with the single word done. This is a non-interactive run: proceed without asking for confirmation."

[fixed.mcp.servers.audit]
command = "python3"
args = ["/work/servers/audit/audit_mcp.py"]
codemode = false

[[factors]]
path = "model.id"
levels = ["RiVault/Reasoning-Small", "RiVault/Instruction-Small"]

[[factors]]
path = "treatment.name"
levels = ["audit-on", "audit-off"]

[budget.per_run]
wall_s = 600

[budget]
max_parallel = 2

[harness]
name = "opencode"

[treatment]
name = "audit-on"
tag = "v1"
source = "/Users/hacker/candler-diet-audit-store/treatment"

[[inputs]]
kind = "servers"
path = "inputs/servers"
at = "servers/audit"
audience = "agent"

[[inputs]]
kind = "oracle"
path = "inputs/oracle"
at = "oracle"
audience = "evaluators"
