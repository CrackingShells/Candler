[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-or-later"
repository = "https://github.com/CrackingShells/Candler"

[workspace.dependencies]
jiff = "0.2"
schemars = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
uuid = "1"

jsonschema = "0.60"
proptest = "1"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
elided_lifetimes_in_paths = "deny"
missing_docs = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
wildcard_enum_match_arm = "deny"
as_conversions = "warn"
explicit_iter_loop = "warn"
manual_filter_map = "warn"
manual_find_map = "warn"
needless_range_loop = "warn"
must_use_candidate = "warn"
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
module_name_repetitions = "allow"
too_many_lines = "allow"
# Public signatures that return a borrow name its lifetime, so clippy's suggestion to elide it is off.
needless_lifetimes = "allow"
