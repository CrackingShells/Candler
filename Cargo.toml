[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.7.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-or-later"
repository = "https://github.com/CrackingShells/Candler"

[workspace.dependencies]
candler-core = { path = "crates/candler-core" }
candler-harness = { path = "crates/candler-harness" }
candler-harness-claude-code = { path = "crates/candler-harness-claude-code" }
candler-schemas = { path = "crates/candler-schemas" }

base64 = "0.23"
clap = { version = "4.6", features = ["derive", "env"] }
flate2 = "1"
futures = "0.3"
globset = "0.4"
jiff = "0.2"
libproc = "0.15"
rand_chacha = "0.10"
regex = "1"
rustix = { version = "1", features = ["fs", "process"] }
ryu-js = "1"
schemars = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_path_to_error = "0.1"
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.11"
shell-words = "1"
statrs = { version = "0.19", default-features = false }
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1"
url = "2"
uuid = { version = "1", features = ["v7"] }

# Pinned exactly, with the default `resolve-http` and `resolve-file` features off, so validation
# never fetches a `$ref` over the network or from the filesystem outside the bundled schemas.
jsonschema = { version = "=0.60.2", default-features = false }
proptest = "1"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
elided_lifetimes_in_paths = "deny"
missing_docs = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
wildcard_enum_match_arm = "deny"
as_conversions = "warn"
explicit_iter_loop = "warn"
manual_filter_map = "warn"
manual_find_map = "warn"
needless_range_loop = "warn"
must_use_candidate = "warn"
allow_attributes_without_reason = "deny"
exhaustive_enums = "warn"
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
module_name_repetitions = "allow"
too_many_lines = "allow"
# Public signatures that return a borrow name its lifetime, so clippy's suggestion to elide it is off.
needless_lifetimes = "allow"
